# Friday-Base: 600M, balanced quality
model:
  vocab_size: 128256
  dim: 1280
  n_layers: 24
  n_heads: 20
  n_kv_heads: 4
  hidden_dim: 5120
  max_seq_len: 8192
  rope_theta: 500000.0
  local_window: 512
  global_every: 4
  tie_word_embeddings: true
training:
  lr: 3.0e-4
  batch_tokens: 262144
  seq_len: 2048
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_ratio: 0.03
