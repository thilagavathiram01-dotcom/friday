# Friday-Flash: 360M, fast reasoning + tool calling
model:
  vocab_size: 128256
  dim: 1024
  n_layers: 15
  n_heads: 16
  n_kv_heads: 4
  hidden_dim: 4096
  max_seq_len: 4096
  rope_theta: 500000.0
  local_window: 512
  global_every: 4
  tie_word_embeddings: true
training:
  lr: 4.0e-4
  batch_tokens: 131072
  seq_len: 2048
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_ratio: 0.03
