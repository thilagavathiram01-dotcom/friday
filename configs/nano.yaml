# Friday-Nano: 140M, fastest, mobile-first
model:
  vocab_size: 128256
  dim: 576
  n_layers: 15
  n_heads: 9
  n_kv_heads: 3
  hidden_dim: 2048
  max_seq_len: 4096
  rope_theta: 500000.0
  local_window: 512
  global_every: 4
  tie_word_embeddings: true
training:
  lr: 6.0e-4
  batch_tokens: 131072
  seq_len: 2048
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_ratio: 0.03
